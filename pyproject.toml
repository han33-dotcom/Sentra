[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentra-audit"
version = "0.1.0"
description = "Wearable data authorization and audit foundation"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.2,<4",
  "requests>=2.32.4,<3",
  "requests-oauthlib>=2.0,<3",
  "cryptography>=46,<47",
  "filelock>=3.20,<4",
  "keyring>=25.6,<26",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = ["pglast>=7,<8"]
viewer = ["streamlit[auth]==1.65.0", "Authlib==1.8.0"]

[project.scripts]
sentra = "sentra.cli:main"
sentra-viewer-setup = "sentra.viewer_setup:main"

[tool.setuptools.packages.find]
where = ["src"]
