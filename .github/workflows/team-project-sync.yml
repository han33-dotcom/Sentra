name: Team project sync
on:
  workflow_run:
    workflows: [Team lifecycle signal]
    types: [completed]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without updating the board
        type: boolean
        default: true
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: team-project-sync
  cancel-in-progress: false
jobs:
  identity:
    if: vars.TEAM_SYNC_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out trusted default-branch code only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Keep task IDs visible on the board and in native Slack titles
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python3 -m scripts.team_workflow.identity
  reconcile:
    if: vars.TEAM_SYNC_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out trusted default-branch code only
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile every declared implementation task
        env:
          GH_TOKEN: ${{ github.token }}
          PROJECTS_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          TEAM_PROJECT_ID: ${{ vars.TEAM_PROJECT_ID }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: python3 -m scripts.team_workflow.sync_project
