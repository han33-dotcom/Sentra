# CI/CD for the backend.
# Branches: feature/* -> PR into develop -> PR develop into main (release). See CONTRIBUTING.md.
#   every PR and push:  data guard + secret scan -> lint + tests (Linux & Windows) -> Docker image build + smoke test
#   push to develop:    + publish image tagged develop / sha-xxxxxxx (no deploy)
#   push to main:       + publish image to GHCR  -> deploy to the backend host (self-hosted runner, opt-in)
#   tag vX.Y.Z:         + publish image with that version
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guard:
    name: Guard (no data, no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tracked files contain no health data or credentials
        run: python3 scripts/check_no_data.py
      - name: Secret scan (gitleaks, full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks detect --source . --redact --verbose --no-banner

  test:
    name: Lint & test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  python: "3.11" }
          - { os: ubuntu-latest,  python: "3.12" }
          - { os: windows-latest, python: "3.12" }   # the scheduled-task backend runs on Windows
    defaults:
      run:
        working-directory: wearables-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: wearables-pipeline/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest

  image:
    name: Docker image
    needs: [guard, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/backend
          tags: |
            type=ref,event=pr
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - name: Build (load locally for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: wearables-pipeline
          load: true
          tags: sentra-backend:ci
          build-args: WP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (API boots, worker heartbeats)
        run: |
          docker run -d --name api -e WP_API_KEY=ci -p 8000:8000 sentra-backend:ci uvicorn wp.api:app --host 0.0.0.0 --port 8000
          docker run -d --name worker -e WP_WORKER_TICK_SEC=2 sentra-backend:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/v1/status)" = 401
          sleep 5 && docker exec worker python -m wp healthcheck
          docker logs worker | tail -5
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: wearables-pipeline
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: WP_VERSION=${{ github.sha }}
          cache-from: type=gha
      - id: ref
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/backend:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    # Turn on once the backend PC runs a self-hosted runner labelled "sentra-backend"
    # (repo variables: DEPLOY_ENABLED=true, DEPLOY_ENV_FILE=<absolute path of the server's .env>). See docs/DEPLOYMENT.md.
    name: Deploy backend
    needs: image
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, sentra-backend]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      BACKEND_IMAGE: ${{ needs.image.outputs.image }}
      ENV_FILE: ${{ vars.DEPLOY_ENV_FILE }}
      WP_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull the new image
        run: docker compose --env-file "${{ vars.DEPLOY_ENV_FILE }}" pull worker api
      - name: Roll out (waits for healthchecks)
        run: docker compose --env-file "${{ vars.DEPLOY_ENV_FILE }}" up -d --no-build --wait --wait-timeout 300 worker api
      - name: Status
        if: always()
        run: docker compose --env-file "${{ vars.DEPLOY_ENV_FILE }}" ps
