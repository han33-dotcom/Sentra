# Example only. Generate actual ignored secrets with `python -m sentra.viewer_setup prepare`.
[viewer]
confirmed_free_plan = false
allowed_emails = ["authorized-teammate@example.test"]
url = "https://PROJECT.supabase.co"
publishable_key = "REPLACE"
storage_email = "RESTRICTED_VIEWER_SERVICE_ACCOUNT"
storage_password = "REPLACE"
certificate_pem = "OFFICIAL_DATABASE_CERTIFICATE_PEM"

[viewer.db]
host = "OFFICIAL_SESSION_POOLER.pooler.supabase.com"
port = 5432
dbname = "postgres"
user = "sentra_viewer.PROJECT"
password = "REPLACE"
sslmode = "verify-full"

[viewer.limits]
database_bytes = 350000000
object_bytes = 700000000
monthly_egress_bytes = 3500000000
reserve_bytes = 20000000

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_SEPARATE_RANDOM_SECRET_AT_LEAST_43_CHARACTERS"
client_id = "SEPARATE_IDENTITY_CLIENT.apps.googleusercontent.com"
client_secret = "REPLACE"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
expose_tokens = []
client_kwargs = { scope = "openid email profile", prompt = "select_account" }
