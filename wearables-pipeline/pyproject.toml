[project]
name = "sentra-wearables-pipeline"
version = "0.2.0"
description = "Sentra FYP backend: wearable data extraction, processing and API"
requires-python = ">=3.10"

[tool.ruff]
line-length = 130
target-version = "py310"
extend-exclude = [".venv", "data", "secrets", "reports"]

[tool.ruff.lint]
select = ["E", "F", "W", "B"]
ignore = ["E501", "E702", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
